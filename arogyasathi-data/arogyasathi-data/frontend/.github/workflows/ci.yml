name: ArogyaSathi CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint --if-present
      
    - name: Type Check
      run: npx tsc --noEmit
      
    - name: Unit & Integration Tests (Eligibility)
      run: npm run test --if-present
      
    - name: Build Next.js
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
        # Test keys / mock envs mapped here securely via Actions Secrets
        GEMINI_API_KEY: ${{ secrets.TEST_GEMINI_API_KEY }}
